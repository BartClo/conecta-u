services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: conecta_u
      POSTGRES_USER: conecta_u
      POSTGRES_PASSWORD: conecta_u
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conecta_u"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
